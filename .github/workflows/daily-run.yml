# Scheduled daily research run (Phase 3 wires this fully).
# Phase 0: scaffold only — runs the orchestrator skeleton, which exits cleanly until the funnel
# is implemented. Secrets (FMP_API_KEY, ANTHROPIC_API_KEY, ...) are configured in repo settings.

name: daily-run

on:
  workflow_dispatch: {}        # manual trigger (used until the funnel is wired)
  # schedule:
  #   - cron: "30 11 * * 1-5"  # ~7:30am ET, weekdays — enable in Phase 3

permissions:
  contents: write              # to commit the dated briefing + run logs back to the repo

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Run daily research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          BIGDATA_API_KEY: ${{ secrets.BIGDATA_API_KEY }}
        run: python -m src.orchestrator

      # Phase 3: commit reports/YYYY-MM-DD.md + updated store/ back to the repo.
