[project]
name = "bear-stearns"
version = "0.1.0"
description = "Personal AI opportunity finder — a daily, decision-support equity research engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # LLM / agents
    "anthropic>=0.40",
    # Data layer
    "httpx>=0.27", # async HTTP for FMP / data clients
    "tenacity>=8.2", # retries/backoff for flaky APIs
    "pydantic>=2.6", # structured-output schemas (scores/IRR/sizing)
    "pydantic-settings>=2.2", # env/secrets loading
    "python-dotenv>=1.0",
    # Numerics / valuation (reverse DCF, sizing math)
    "numpy>=1.26",
    "pandas>=2.2",
    # Report generation
    "jinja2>=3.1", # markdown briefing templates
    "rich>=13.7", # pretty CLI run output
    "lxml>=6.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
bear-run = "src.orchestrator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
